<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S1C33 memory dump (embedded payload)</title>
</head>
<body>
  <h1>S1C33 memory dump</h1>

  <p id="support"></p>

  <p>
    <button id="connect" type="button">Connect serial port</button>
    <span id="connection">Not connected</span>
  </p>

  <form id="dump-form">
    <p>
      <label>Start address <input id="start" value="0x00000000" required></label>
    </p>
    <p>
      <label>End address (exclusive) <input id="end" value="0x00000100" required></label>
    </p>
    <p>
      <label>Bus speed
        <select id="bus-speed">
          <option>SYSCLK/4</option>
          <option selected>SYSCLK/2</option>
          <option>SYSCLK/1</option>
          <option>SYSCLK/8</option>
        </select>
      </label>
    </p>
    <p>
      <label>Download filename <input id="filename" value="dump.bin" required></label>
    </p>
    <button id="dump" type="submit" disabled>Dump memory</button>
  </form>

  <p><progress id="progress" value="0" max="1"></progress> <span id="progress-text"></span></p>
  <pre id="status">Ready.</pre>

  <script>
    "use strict";

    const BAUD_RATE = 921600;
    const COMMAND_TIMEOUT_MS = 5000;
    const DEBUG_ROM_BASE = 0x60000;
    const DEBUG_RAM_BASE = 0x84780;
    const SYSCLK_CHOICES = ["SYSCLK/4", "SYSCLK/2", "SYSCLK/1", "SYSCLK/8"];

    const PAYLOAD_BASE64 = "";
    const PAYLOAD_UPLOAD_ADDRESS = 0x00000100;
    const ENTRYPOINT_OFFSETS = {
      DUMP: 0x00000000,
      FLASH_ERASE: 0x00000000,
      FLASH_LOAD: 0x00000000,
      BULK_LOAD: 0x00000000,
    };

    const connectButton = document.querySelector("#connect");
    const dumpButton = document.querySelector("#dump");
    const statusElement = document.querySelector("#status");
    const connectionElement = document.querySelector("#connection");
    const progressElement = document.querySelector("#progress");
    const progressText = document.querySelector("#progress-text");
    const supportElement = document.querySelector("#support");

    let port = null;
    let reader = null;
    let writer = null;
    let pendingInput = new Uint8Array(0);

    if (!("serial" in navigator)) {
      supportElement.textContent = "Web Serial is not supported by this browser. Use a Chromium-based browser on localhost or HTTPS.";
      connectButton.disabled = true;
    } else {
      supportElement.textContent = "Web Serial requires a Chromium-based browser and a secure context (HTTPS or localhost).";
    }

    function setStatus(message) {
      statusElement.textContent = message;
    }

    function parseAddress(value, name) {
      const text = value.trim();
      if (!/^(?:0[xX][0-9a-fA-F]+|[0-9]+)$/.test(text)) {
        throw new Error(`${name} must be a decimal or 0x-prefixed hexadecimal integer.`);
      }
      const number = Number(text);
      if (!Number.isSafeInteger(number) || number < 0 || number > 0xffffffff) {
        throw new Error(`${name} must be between 0 and 0xffffffff.`);
      }
      return number;
    }

    function concatBytes(left, right) {
      const result = new Uint8Array(left.length + right.length);
      result.set(left);
      result.set(right, left.length);
      return result;
    }

    async function readExactly(length, timeoutMs = COMMAND_TIMEOUT_MS) {
      if (!reader) throw new Error("Serial port is not connected.");
      const output = new Uint8Array(length);
      let offset = 0;
      const deadline = performance.now() + timeoutMs;

      if (pendingInput.length) {
        const count = Math.min(length, pendingInput.length);
        output.set(pendingInput.subarray(0, count));
        pendingInput = pendingInput.slice(count);
        offset = count;
      }

      while (offset < length) {
        const remaining = deadline - performance.now();
        if (remaining <= 0) throw new Error("Serial read timed out. Check the connection and try again.");

        let timer;
        const timeout = new Promise((_, reject) => {
          timer = setTimeout(() => reject(new Error("Serial read timed out. Check the connection and try again.")), remaining);
        });
        let result;
        try {
          result = await Promise.race([reader.read(), timeout]);
        } finally {
          clearTimeout(timer);
        }
        if (result.done) throw new Error("The serial port was disconnected.");
        if (!result.value || result.value.length === 0) continue;

        const count = Math.min(length - offset, result.value.length);
        output.set(result.value.subarray(0, count), offset);
        offset += count;
        if (count < result.value.length) {
          pendingInput = concatBytes(pendingInput, result.value.subarray(count));
        }
      }
      return output;
    }

    async function writeAll(bytes) {
      if (!writer) throw new Error("Serial port is not connected.");
      await writer.write(bytes);
    }

    function makeCommand(id, arg = 0, address = 0, data1 = 0, data2 = 0) {
      const bytes = new Uint8Array(14);
      const view = new DataView(bytes.buffer);
      view.setUint8(0, id);
      view.setUint8(1, arg);
      view.setUint32(2, address >>> 0, true);
      view.setUint32(6, data1 >>> 0, true);
      view.setUint32(10, data2 >>> 0, true);
      return bytes;
    }

    async function command(id, arg = 0, address = 0, data1 = 0, data2 = 0) {
      await writeAll(makeCommand(id, arg, address, data1, data2));
      return readExactly(8);
    }

    const writeByte = (address, value) => command(2, 0, address, value);
    const writeWord = (address, value) => command(7, 0, address, value);

    function decodePayload() {
      const encoded = PAYLOAD_BASE64.replace(/\\s/g, "");
      if (!encoded) throw new Error("PAYLOAD_BASE64 has not been configured.");
      let binary;
      try {
        binary = atob(encoded);
      } catch (_) {
        throw new Error("PAYLOAD_BASE64 is not valid base64.");
      }
      const payload = Uint8Array.from(binary, character => character.charCodeAt(0));
      if (PAYLOAD_UPLOAD_ADDRESS + payload.length > 0x100000000) {
        throw new Error("The payload extends beyond the 32-bit address space.");
      }
      return payload;
    }

    function entrypointAddress(name) {
      const offset = ENTRYPOINT_OFFSETS[name];
      if (!Number.isInteger(offset) || offset < 0 || offset > 0xffffffff) {
        throw new Error(`ENTRYPOINT_OFFSETS.${name} is invalid.`);
      }
      const address = PAYLOAD_UPLOAD_ADDRESS + offset;
      if (!Number.isSafeInteger(address) || address > 0xffffffff) {
        throw new Error(`The ${name} entrypoint is outside the 32-bit address space.`);
      }
      return address;
    }

    async function uploadPayload(payload) {
      setStatus("Uploading payload...");
      for (let index = 0; index < payload.length; index++) {
        await writeByte((PAYLOAD_UPLOAD_ADDRESS + index) >>> 0, payload[index]);
        progressElement.value = payload.length ? (index + 1) / payload.length : 1;
        progressText.textContent = `${index + 1} / ${payload.length} upload bytes`;
      }
    }

    const CRC_TABLE = (() => {
      const table = new Uint32Array(256);
      for (let index = 0; index < 256; index++) {
        let value = index;
        for (let bit = 0; bit < 8; bit++) value = (value & 1) ? (0xedb88320 ^ (value >>> 1)) : (value >>> 1);
        table[index] = value >>> 0;
      }
      return table;
    })();

    function crc32(bytes) {
      let crc = 0xffffffff;
      for (const byte of bytes) crc = CRC_TABLE[(crc ^ byte) & 0xff] ^ (crc >>> 8);
      return (crc ^ 0xffffffff) >>> 0;
    }

    async function receiveDump(total) {
      const output = new Uint8Array(total);
      let offset = 0;
      while (offset < total) {
        const header = (await readExactly(1))[0];
        if (header === 128) continue;

        if (header < 128) {
          const count = header + 1;
          if (offset + count > total) throw new Error("Compressed stream expands beyond the requested range.");
          output.set(await readExactly(count), offset);
          offset += count;
        } else {
          const count = 257 - header;
          if (offset + count > total) throw new Error("Compressed stream expands beyond the requested range.");
          output.fill((await readExactly(1))[0], offset, offset + count);
          offset += count;
        }
        progressElement.value = total ? offset / total : 1;
        progressText.textContent = `${offset} / ${total} dump bytes`;
      }
      return output;
    }

    function download(bytes, filename) {
      const url = URL.createObjectURL(new Blob([bytes], {type: "application/octet-stream"}));
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function disconnect() {
      if (reader) { reader.releaseLock(); reader = null; }
      if (writer) { writer.releaseLock(); writer = null; }
      if (port) { await port.close(); port = null; }
      pendingInput = new Uint8Array(0);
      connectionElement.textContent = "Not connected";
      connectButton.textContent = "Connect serial port";
      dumpButton.disabled = true;
    }

    connectButton.addEventListener("click", async () => {
      connectButton.disabled = true;
      try {
        if (port) {
          await disconnect();
          setStatus("Disconnected.");
        } else {
          port = await navigator.serial.requestPort();
          await port.open({baudRate: BAUD_RATE});
          reader = port.readable.getReader();
          writer = port.writable.getWriter();
          pendingInput = new Uint8Array(0);
          connectionElement.textContent = "Connected at 921600 baud";
          connectButton.textContent = "Disconnect";
          dumpButton.disabled = false;
          setStatus("Connected.");
        }
      } catch (error) {
        if (port && (!reader || !writer)) {
          try { await disconnect(); } catch (_) { /* retain the original error */ }
        }
        setStatus(`Error: ${error.message}`);
      } finally {
        connectButton.disabled = false;
      }
    });

    document.querySelector("#dump-form").addEventListener("submit", async event => {
      event.preventDefault();
      dumpButton.disabled = true;
      connectButton.disabled = true;
      progressElement.value = 0;
      progressText.textContent = "";
      try {
        const start = parseAddress(document.querySelector("#start").value, "Start address");
        const end = parseAddress(document.querySelector("#end").value, "End address");
        if (end <= start) throw new Error("End address must be greater than start address.");
        const total = end - start;
        const payload = decodePayload();
        const dumpEntrypoint = entrypointAddress("DUMP");

        setStatus("Configuring miscellaneous registers...");
        await writeByte(0x300020, 0x96);
        await writeByte(0x300016, 0x00);
        await writeByte(0x300018, 0x01);

        const busSpeed = document.querySelector("#bus-speed").value;
        setStatus(`Setting bus speed to ${busSpeed}...`);
        await writeByte(DEBUG_ROM_BASE + 0x18067, SYSCLK_CHOICES.indexOf(busSpeed));

        await uploadPayload(payload);
        setStatus("Dumping memory...");
        progressElement.value = 0;
        await writeWord(DEBUG_RAM_BASE + 100, dumpEntrypoint);
        await writeAll(makeCommand(1, 0, start, end, 0));
        const output = await receiveDump(total);

        const response = await readExactly(8);
        const expectedCrc = new DataView(response.buffer, response.byteOffset, response.byteLength).getUint32(0, true);
        const actualCrc = crc32(output);
        if (actualCrc !== expectedCrc) {
          throw new Error(`CRC mismatch (device 0x${expectedCrc.toString(16).padStart(8, "0")}, local 0x${actualCrc.toString(16).padStart(8, "0")}).`);
        }

        download(output, document.querySelector("#filename").value.trim() || "dump.bin");
        setStatus(`Complete. Received ${total} bytes; CRC32 0x${actualCrc.toString(16).padStart(8, "0")}.`);
      } catch (error) {
        setStatus(`Error: ${error.message}`);
      } finally {
        dumpButton.disabled = !port;
        connectButton.disabled = false;
      }
    });

    navigator.serial?.addEventListener("disconnect", event => {
      if (event.port === port || event.target === port) {
        reader = null;
        writer = null;
        port = null;
        pendingInput = new Uint8Array(0);
        connectionElement.textContent = "Disconnected";
        connectButton.textContent = "Connect serial port";
        dumpButton.disabled = true;
        setStatus("The serial device was disconnected.");
      }
    });
  </script>
</body>
</html>
