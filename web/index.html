<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S1C33 flasher</title>
  <script src="payload.js"></script>
</head>
<body>
  <h1>S1C33 flasher</h1>

  <p><button id="connect">Connect</button></p>

  <fieldset id="controls" disabled>
    <p>
      <label>Bus speed
        <select id="bus-speed">
          <option value="0" selected>SYSCLK/4</option>
          <option value="1">SYSCLK/2</option>
          <option value="2">SYSCLK/1</option>
          <option value="3">SYSCLK/8</option>
        </select>
      </label>
    </p>

    <h2>Read</h2>
    <p>
      <label>Start <input id="read-start" value="0x2000000"></label>
      <label>End <input id="read-end" value="0x2800000"></label>
      <button id="read">Read</button>
    </p>

    <h2>Write</h2>
    <p>
      <label>File <input id="write-file" type="file"></label>
      <label>Start <input id="write-start" value="0x2000000"></label>
      <label><input id="erase" type="checkbox" checked> Erase chip first</label>
      <button id="write">Write</button>
    </p>
  </fieldset>

  <p><progress id="progress" value="0"></progress> <span id="progress-text"></span></p>
  <pre id="log"></pre>

  <script>
    "use strict";

    const DEBUG_ROM_BASE  = 0x60000;
    const DEBUG_RAM_BASE  = 0x84780;
    const PAYLOAD_ADDRESS = 0x100;
    const FLASH           = 0x2000000;

    const EXEC = 1, WRITE_BYTE = 2, WRITE_WORD = 7, PING = 9;
    const READ = 0, ERASE = 1, MAP = 2, WRITE = 3;
    const OK = 0, BAD_FRAME = 1;
    const STATUS = ["ok", "write CRC mismatch", "flash verify failed", "could not map write buffer"];

    const FLAG = 0x7E, ESCAPE = 0x7D, READY = 0xA5;

    const BUFFER_SIZE   = 0x3000;
    const WRITE_CHUNK   = BUFFER_SIZE - BUFFER_SIZE / 128;
    const READ_CHUNK    = 0x10000;
    const RETRIES       = 5;
    const TIMEOUT       = 5000;
    const ERASE_TIMEOUT = 120000;

    const $ = id => document.getElementById(id);

    const payload = Uint8Array.from(PAYLOAD.match(/../g), byte => parseInt(byte, 16));

    const CRC_TABLE = Uint32Array.from({length: 256}, (_, n) => {
      for (let bit = 0; bit < 8; bit++)
        n = n & 1 ? 0xEDB88320 ^ (n >>> 1) : n >>> 1;
      return n;
    });

    const crc32 = (crc, byte) => CRC_TABLE[(crc ^ byte) & 0xFF] ^ (crc >>> 8);

    let port = null, reader, writer, pending;
    let rx = new Uint8Array(), rxPos = 0;
    let busy = false;

    const log = message => $("log").textContent += message + "\n";

    const hex = value => value.toString(16).padStart(8, "0");

    const fatal = message => Object.assign(new Error(message), {fatal: true});

    function number(id) {
      const value = Number($(id).value);

      if (!Number.isInteger(value) || value < 0 || value > 0xFFFFFFFF)
        throw new Error(`invalid ${id}`);

      return value;
    }

    function duration(seconds) {
      const s = Math.ceil(seconds);
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    }

    function progress(done, total, started, eta) {
      const seconds = (performance.now() - started) / 1000;
      const left = eta ? `, ${duration(seconds * (total - done) / done)} left` : "";

      $("progress").value = done / total;
      $("progress-text").textContent = `${done} / ${total} bytes, ${(done / 1024 / seconds).toFixed(1)} KiB/s${left}`;
    }

    function download(data, name) {
      const link = document.createElement("a");

      link.href = URL.createObjectURL(new Blob([data]));
      link.download = name;
      link.click();

      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    }

    async function fill(timeout) {
      let timer;

      pending ??= reader.read();
      const result = await Promise.race([pending, new Promise(resolve => timer = setTimeout(resolve, timeout))]);
      clearTimeout(timer);

      if (!result)
        return false;

      pending = null;

      if (result.done)
        throw new Error("serial port closed");

      rx = result.value;
      rxPos = 0;

      return true;
    }

    async function receive(timeout = TIMEOUT) {
      while (rxPos === rx.length)
        if (!await fill(timeout))
          throw new Error("timed out");

      return rx[rxPos++];
    }

    async function drain() {
      do rxPos = rx.length;
      while (await fill(200));
    }

    const send = bytes => writer.write(Uint8Array.from(bytes));

    function packet(id, arg, a = 0, b = 0) {
      const view = new DataView(new ArrayBuffer(14));

      view.setUint8(0, id);
      view.setUint8(1, arg);
      view.setUint32(2, a, true);
      view.setUint32(6, b, true);

      return new Uint8Array(view.buffer);
    }

    async function reply(timeout) {
      const bytes = new Uint8Array(8);

      for (let i = 0; i < bytes.length; i++)
        bytes[i] = await receive(timeout);

      return new DataView(bytes.buffer).getUint32(0, true);
    }

    async function command(id, arg, a, b, timeout) {
      await send(packet(id, arg, a, b));
      return reply(timeout);
    }

    async function poke(id, address, value) {
      if (await command(id, 0, address, value) !== id)
        throw new Error("monitor out of sync");
    }

    function check(status) {
      if (status !== OK)
        throw fatal(STATUS[status] ?? `unknown status ${status}`);
    }

    async function retry(task) {
      for (let attempt = 1; ; attempt++) {
        try {
          return await task();
        } catch (error) {
          if (error.fatal || attempt === RETRIES)
            throw error;

          log(`${error.message}, retrying`);
          await drain();
        }
      }
    }

    const call = (op, a, b, timeout) => retry(async () => check(await command(EXEC, op, a, b, timeout)));

    function packbits(data) {
      const out = [];

      for (let i = 0; i < data.length; ) {
        let run = 1;
        while (run < 128 && data[i + run] === data[i])
          run++;

        if (run >= 3) {
          out.push(257 - run, data[i]);
          i += run;
          continue;
        }

        const start = i;
        while (i < data.length && i - start < 128 && !(data[i] === data[i + 1] && data[i] === data[i + 2]))
          i++;

        out.push(i - start - 1, ...data.subarray(start, i));
      }

      return Uint8Array.from(out);
    }

    function frame(bytes) {
      const out = [];

      for (const byte of bytes) {
        if (byte === FLAG || byte === ESCAPE)
          out.push(ESCAPE, byte ^ 0x20);
        else
          out.push(byte);
      }

      out.push(FLAG);

      return out;
    }

    async function setup() {
      await poke(WRITE_BYTE, 0x300020, 0x96);
      await poke(WRITE_BYTE, 0x300016, 0x00);
      await poke(WRITE_BYTE, 0x300018, 0x01);
      await poke(WRITE_BYTE, DEBUG_ROM_BASE + 0x18067, Number($("bus-speed").value));

      for (let i = 0; i < payload.length; i += 4) {
        const word = payload[i] | payload[i + 1] << 8 | payload[i + 2] << 16 | payload[i + 3] << 24;
        await poke(WRITE_WORD, PAYLOAD_ADDRESS + i, word);
      }

      await poke(WRITE_WORD, DEBUG_RAM_BASE + 100, PAYLOAD_ADDRESS);

      const echo = await readChunk(PAYLOAD_ADDRESS, payload.length);
      if (echo.some((byte, i) => byte !== payload[i]))
        throw new Error("payload upload corrupted");
    }

    async function readChunk(address, length) {
      const data = new Uint8Array(length);
      let crc = -1;

      await send(packet(EXEC, READ, address, length));

      for (let i = 0; i < length; ) {
        const header = await receive();
        if (header === 128)
          continue;

        const count = header < 128 ? header + 1 : 257 - header;
        if (i + count > length)
          throw new Error("read stream overrun");

        const repeat = header > 128 ? await receive() : undefined;

        for (const end = i + count; i < end; i++) {
          data[i] = repeat ?? await receive();
          crc = crc32(crc, data[i]);
        }
      }

      if (await reply() !== ~crc >>> 0)
        throw new Error("read CRC mismatch");

      return data;
    }

    async function writeChunk(address, packed) {
      await send(packet(EXEC, WRITE, address, ~packed.reduce(crc32, -1) >>> 0));

      if (await receive() !== READY)
        throw new Error("payload not ready");

      await send(frame(packed));
      const status = await reply();

      if (status === BAD_FRAME)
        throw new Error(STATUS[status]);

      check(status);
    }

    async function read() {
      const start = number("read-start");
      const length = number("read-end") - start;

      if (length <= 0)
        throw new Error("end must be after start");

      const data = new Uint8Array(length);
      const started = performance.now();

      for (let offset = 0; offset < length; offset += READ_CHUNK) {
        const size = Math.min(READ_CHUNK, length - offset);

        data.set(await retry(() => readChunk(start + offset, size)), offset);
        progress(offset + size, length, started);
      }

      download(data, `${hex(start)}-${hex(start + length)}.bin`);
    }

    async function write() {
      const file = $("write-file").files[0];
      const start = number("write-start");

      if (!file)
        throw new Error("no file selected");
      if (start % 2)
        throw new Error("start must be even");

      const data = new Uint8Array(file.size + file.size % 2).fill(0xFF);
      data.set(new Uint8Array(await file.arrayBuffer()));

      const chunks = [];
      for (let offset = 0; offset < data.length; offset += WRITE_CHUNK) {
        const chunk = data.subarray(offset, offset + WRITE_CHUNK);

        if (chunk.some(byte => byte !== 0xFF))
          chunks.push({address: start + offset, packed: packbits(chunk)});
      }

      const total = chunks.reduce((sum, chunk) => sum + chunk.packed.length, 0);

      if ($("erase").checked) {
        log("Erasing chip...");
        await call(ERASE, FLASH, 0, ERASE_TIMEOUT);
      }

      await call(MAP);

      log(`Writing ${total} packed bytes...`);
      const started = performance.now();
      let done = 0;

      for (const {address, packed} of chunks) {
        await retry(() => writeChunk(address, packed));

        done += packed.length;
        progress(done, total, started, true);
      }
    }

    async function run(task) {
      busy = true;
      update();

      $("log").textContent = "";
      $("progress").value = 0;
      $("progress-text").textContent = "";

      try {
        await drain();

        if (await command(PING, 0, 0, 0, 500).catch(() => 0) !== PING)
          throw new Error("debug link out of sync, replug the Pico and try again");

        log("Uploading payload...");
        await retry(setup);

        await task();
        log("Done.");
      } catch (error) {
        log(`Error: ${error.message}`);
      } finally {
        busy = false;
        update();
      }
    }

    async function connect() {
      const selected = await navigator.serial.requestPort();

      await selected.open({baudRate: 921600});

      reader = selected.readable.getReader();
      writer = selected.writable.getWriter();
      pending = null;
      rx = new Uint8Array();
      rxPos = 0;
      port = selected;
    }

    async function disconnect() {
      const closing = port;
      port = null;

      await reader.cancel();
      reader.releaseLock();
      writer.releaseLock();
      await closing.close();
    }

    function update() {
      $("connect").textContent = port ? "Disconnect" : "Connect";
      $("connect").disabled = busy || !navigator.serial;
      $("controls").disabled = busy || !port;
    }

    $("connect").onclick = async () => {
      try {
        await (port ? disconnect() : connect());
      } catch (error) {
        log(`Error: ${error.message}`);
      }

      update();
    };

    $("read").onclick = () => run(read);
    $("write").onclick = () => run(write);

    navigator.serial?.addEventListener("disconnect", event => {
      if (event.target !== port)
        return;

      port = null;
      update();
      log("Device disconnected.");
    });

    if (!navigator.serial)
      log("Web Serial is not available, use a Chromium-based browser.");

    update();
  </script>
</body>
</html>
